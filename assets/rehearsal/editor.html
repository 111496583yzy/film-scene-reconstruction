<template id="rehearsal-template">
<section id="rehearsal-app" class="rehearsal-app" aria-label="排戏工作台" hidden>
  <header class="rh-header">
    <div class="rh-brand"><button id="rh-back" type="button" class="quiet-button">← 返回拉片</button><strong>排戏模式</strong><label class="sr-only" for="rh-title">方案名称</label><input id="rh-title" aria-label="方案名称" maxlength="240"></div>
    <div class="rh-actions"><button id="rh-undo" type="button">撤销</button><button id="rh-redo" type="button">重做</button><button id="rh-save" type="button" class="primary-button">保存工程</button><button id="rh-theme" type="button" aria-label="切换排戏明暗主题">明暗</button></div>
  </header>
  <div class="rh-commandbar"><div><button id="rh-new" type="button">新建</button><button id="rh-demo" type="button">排戏示例</button><button id="rh-copy-all" type="button">复制整段拉片</button><button id="rh-open" type="button">打开工程</button><input id="rh-file" type="file" accept=".json,application/json" hidden><button id="rh-restore" type="button">恢复本机草稿</button></div><span id="rh-save-state" role="status">尚未保存</span></div>
  <main class="rh-workspace">
    <aside class="rh-library" aria-label="人物与布景"><div class="rh-section-heading"><h2>人物</h2><button id="rh-add-actor" type="button">添加</button></div><label class="sr-only" for="rh-actor-preset">添加新人物或复用已有角色</label><select id="rh-actor-preset" aria-label="添加新人物或复用已有角色"><option value="">新人物</option></select><div id="rh-actors" class="rh-object-list"></div><div class="rh-section-heading"><h2>布景</h2></div><div class="rh-add-prop"><label class="sr-only" for="rh-prop-preset">布景种类</label><select id="rh-prop-preset" aria-label="布景种类"><option value="table">桌子</option><option value="chair">座椅</option><option value="door">门框</option><option value="wall">墙体</option><option value="window">窗户</option><option value="stage">台面</option></select><button id="rh-add-prop" type="button">添加</button></div><div id="rh-elements" class="rh-object-list"></div><div class="rh-scene-reference"><button id="rh-scene-reference" type="button">添加场景参考图</button><img id="rh-scene-reference-image" alt="场景参考，仅用于构图对照" hidden></div><div class="rh-library-footer"><button id="rh-camera-object" type="button">选中摄影机</button><p>造型参考图不是三维还原；当前人物是排戏替身。</p></div></aside>
    <section class="rh-stage-panel" aria-label="可编辑三维片场"><div class="rh-panel-heading"><h2 id="rh-scene-name">我的片场</h2><div class="rh-view-buttons"><button id="rh-overview" type="button" aria-pressed="true">片场</button><button id="rh-top" type="button" aria-pressed="false">俯视</button><button id="rh-observe" type="button" aria-pressed="false">只转着看</button></div></div><div id="rh-stage" class="rh-stage"></div><div class="rh-stage-tools"><div role="group" aria-label="编辑动作位置"><button id="rh-start" type="button" aria-pressed="true">设置起点</button><button id="rh-end" type="button" aria-pressed="false">设置终点</button></div><button id="rh-place" type="button">点地面摆放</button><label><input id="rh-paths" type="checkbox" checked>显示路线</label></div><p id="rh-edit-hint" class="rh-hint">拖动人物、蓝色摄影机或它们的文字标签。空白处仅旋转查看。</p></section>
    <aside class="rh-detail" aria-label="机位画面与选中对象"><section class="rh-preview-panel" aria-label="当前摄影机画面"><div class="rh-panel-heading"><h2>这一机拍到的画面</h2><button id="rh-export-frame" type="button">导出分镜图</button></div><div id="rh-preview" class="rh-preview"></div></section><section class="rh-inspector"><div class="rh-section-heading"><h2 id="rh-selection-title">摄影机</h2><button id="rh-delete-object" type="button">移除</button></div><p id="rh-scope" class="rh-hint">仅编辑当前镜头。</p><div id="rh-properties"></div></section></aside>
  </main>
  <footer class="rh-dock"><div class="rh-playbar"><button id="rh-prev" type="button" aria-label="上一排戏镜头">上一镜</button><button id="rh-play" type="button" class="primary-button">播放预演</button><button id="rh-next" type="button" aria-label="下一排戏镜头">下一镜</button><output id="rh-time" class="mono">0:00.00</output><input id="rh-seek" type="range" min="0" max="6" value="0" step="0.01" aria-label="排戏预演进度"><output id="rh-total" class="mono">0:06.00</output><button id="rh-export-top" type="button">导出走位图</button><button id="rh-export-page" type="button">导出可播放页面</button></div><div class="rh-shot-heading"><span>镜头</span><button id="rh-clone-shot" type="button">复制当前镜头</button><button id="rh-left-shot" type="button" aria-label="当前镜头前移">前移</button><button id="rh-right-shot" type="button" aria-label="当前镜头后移">后移</button><button id="rh-delete-shot" type="button">删除当前镜头</button></div><div id="rh-shots" class="rh-shots" role="toolbar" aria-label="排戏镜头顺序"></div></footer>
  <div id="rh-notice" class="rh-notice" role="status" aria-live="polite" hidden></div>
  <input id="rh-scene-reference-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
  <input id="rh-reference-file" type="file" accept="image/png,image/jpeg,image/webp" hidden>
</section>
</template>
