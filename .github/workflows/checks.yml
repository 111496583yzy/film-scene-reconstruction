name: Skill checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Shot and scene regression tests
        run: |
          node scripts/selftest.mjs
          node scripts/scene-selftest.mjs
          node scripts/scene-3d-selftest.mjs
          node scripts/ui-selftest.mjs
      - name: Offline model-adapter tests (no API calls)
        run: |
          python3 scripts/test_qwen_omni_enrich.py
          python3 scripts/test_video_model_enrich.py
